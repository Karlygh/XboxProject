
<nav class="p-3" style="background-color: #62911c;">
  <div class="container mx-auto">
    <div class="flex flex-col md:flex-row items-center justify-between">
      
      <!-- Logo y título -->
      <button routerLink="/" class="flex items-center mb-4 md:mb-0 hover:opacity-80 transition-opacity cursor-pointer bg-transparent border-0 p-0">
        <img src="assets/images/logo2.png" alt="Logo" class="h-9 w-12 mr-3"/>
        <span class="text-white font-bold text-xl">Game Classic´s Pass</span>
      </button>

      <!-- Enlaces y buscador -->
      <div class="flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-6 w-full md:w-auto">
        <a href="#" class="text-white hover:text-[#d2eaad] font-medium">Inicio</a>        
        <div class="relative w-full md:w-auto search-wrapper">
          <input
            #searchInput
            type="search"
            placeholder="Buscar juegos..."
            [(ngModel)]="searchQuery"
            (input)="onSearchInput($event)"
            (keyup.enter)="onSearch($event)"
            (blur)="onBlur()"
            class="px-4 py-1 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-50 w-full md:w-auto search-input"
          />
          <button 
            (click)="onSearchButtonClick()" 
            class="absolute right-3 top-1/2 transform -translate-y-1/2 hover:opacity-80 transition-opacity"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 oklch(14.5% 0 0)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>

          <!-- Dropdown de resultados -->
          <div 
            #dropdownContainer
            *ngIf="showDropdown() && filteredGames().length > 0"
            class="search-dropdown"
            [style.top]="dropdownPosition().top"
            [style.left]="dropdownPosition().left"
            [style.width]="dropdownPosition().width"
          >
            <div *ngFor="let game of filteredGames()" 
              class="search-item"
              (click)="onGameSelect(game)"
              (mousedown)="$event.preventDefault()"
            >
              <div class="search-item-content">
                <p class="search-item-title">{{ game.title }}</p>
                <p class="search-item-category">{{ game.category }}</p>
                <p class="search-item-description">{{ game.description }}</p>
              </div>
              <div class="search-item-price">
                {{ game.price === 0 ? 'Gratis' : '$' + game.price }}
              </div>
            </div>
          </div>

          <!-- Mensaje de sin resultados -->
          <div 
            *ngIf="showDropdown() && filteredGames().length === 0 && searchQuery().length > 0"
            class="search-dropdown"
            [style.top]="dropdownPosition().top"
            [style.left]="dropdownPosition().left"
            [style.width]="dropdownPosition().width"
          >
            <div class="no-results-message">
              <p>No se encontraron juegos para "{{ searchQuery() }}"</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</nav>
