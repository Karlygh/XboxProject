<section class="coop-section">
  <!-- Header fijo -->
  <div class="section-header">
    <h2 class="main-title">Juega en Local</h2>
    <p class="main-subtitle">Hasta 4 jugadores · En el mismo sofá · Diversión garantizada</p>
  </div>

  <!-- Carrusel 3D -->
  <div class="carousel-wrapper">
    <div class="carousel-container" [style.transform]="'rotateY(' + rotation + 'deg)'">
      <div 
        *ngFor="let game of coopGames; let i = index"
        class="carousel-item"
        [style.transform]="getItemTransform(i)"
        (click)="openGameModal(game)">
        
        <img 
          [src]="ASSETS_PATH + game.image" 
          [alt]="game.title"
          class="carousel-image">
        
        <div class="carousel-info">
          <h3>{{ game.title }}</h3>
          <p>{{ game.players }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles de navegación -->
  <div class="carousel-controls">
    <button class="control-btn prev-btn" (click)="rotateCarousel('prev')">
      <span>← Anterior</span>
    </button>
    <div class="carousel-counter">
      <span>{{ currentCardIndex + 1 }} / {{ coopGames.length }}</span>
    </div>
    <button class="control-btn next-btn" (click)="rotateCarousel('next')">
      <span>Siguiente →</span>
    </button>
  </div>
</section>
